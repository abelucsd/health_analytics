name: FastAPI CI

on:
  push:
    branches:
      - main
      - dev
    pull_request:
      branches:
        - main
        - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Docker build image
        run: docker compose build
